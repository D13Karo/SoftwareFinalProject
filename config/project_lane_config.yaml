# Lane-following tuning copied from the known-good real-bot repo
# (Traffic-signs-kvatitown/config/lane_servoing_config.yaml). Faster cruise with
# gentle steering tracks the real track far better than the sim crawl values.
base_speed: 0.38
curve_boost: 1.5
curve_speed: 0.2
curve_threshold: 200
d_gain: 0.32
detection_threshold: 100
max_steer: 0.35
p_gain: 0.16
steering_threshold: 0.2
trim: 0.05
